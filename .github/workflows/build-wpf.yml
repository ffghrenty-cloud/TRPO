name: Build WPF application

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build .NET Framework 4.8 WPF project
        shell: pwsh
        run: msbuild "WpfApp1/WpfApp1/WpfApp1.csproj" /m /restore /t:Build /p:Configuration=Release /p:Platform="AnyCPU" /v:minimal
